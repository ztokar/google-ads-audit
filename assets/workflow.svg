<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc"><title id="title">Connect, inspect, decide</title><desc id="desc">Connect your own Google account, inspect conversion and campaign evidence, then decide what to verify and fix.</desc><rect width="1200" height="310" rx="22" fill="#f5f7fc"/><g font-family="Arial, sans-serif"><text x="42" y="45" fill="#5e6d84" font-size="15" letter-spacing="3">FROM ACCOUNT DATA TO A CLEAR NEXT STEP</text><path d="M369 171h40m-12-10 12 10-12 10M772 171h40m-12-10 12 10-12 10" stroke="#2457ff" stroke-width="3" fill="none"/><g fill="#fff" stroke="#dce3ef"><rect x="32" y="76" width="330" height="200" rx="16"/><rect x="435" y="76" width="330" height="200" rx="16"/><rect x="838" y="76" width="330" height="200" rx="16"/></g><g fill="#2457ff" font-size="17" font-weight="700"><text x="58" y="115">01 / YOUR ACCOUNT</text><text x="461" y="115">02 / THE EVIDENCE</text><text x="864" y="115">03 / YOUR NEXT MOVE</text></g><g fill="#10213b" font-size="37" font-weight="700"><text x="58" y="172">Connect.</text><text x="461" y="172">Inspect.</text><text x="864" y="172">Decide.</text></g><g fill="#526177" font-size="19"><text x="58" y="213">Your Google sign-in.</text><text x="58" y="241">Local, read-only tools.</text><text x="461" y="213">Purchases, goals, brand traffic.</text><text x="461" y="241">Unknowns stay visible.</text><text x="864" y="213">Priorities with supporting data.</text><text x="864" y="241">No automatic account edits.</text></g></g></svg>